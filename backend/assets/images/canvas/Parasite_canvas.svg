<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Основное тело рамки: жирный черный контур и глубокая бордовая подложка (как тень на курсоре) -->
  <rect x="28" y="28" width="456" height="456" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" rx="16" />
  <rect x="33" y="33" width="446" height="446" fill="none" stroke="#990012" stroke-width="6" rx="12" />

  <!-- Внутренний яркий алый кант (основной цвет курсора) -->
  <rect x="42" y="42" width="428" height="428" fill="none" stroke="#e62229" stroke-width="4" rx="8" />

  <!-- УГЛОВЫЕ МОДУЛИ: Стилизованные стрелы со скруглениями и разрывами -->

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Маркерный элемент с точкой -->
  <g transform="translate(20, 20)">
    <!-- Внутреннее заполнение угла (двойной цвет: алый и бордовая тень) -->
    <polygon points="14,14 70,24 40,40 24,70" fill="#e62229" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="40,40 70,24 55,55 24,70" fill="#990012" />
    
    <!-- Фирменный разрыв линии и акцентная точка (как на крыле image_3be112.png) -->
    <line x1="14" y1="45" x2="14" y2="60" stroke="#000000" stroke-width="10" stroke-linecap="round" />
    <circle cx="14" cy="30" r="5" fill="#000000" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(492, 20) scale(-1, 1)">
    <polygon points="14,14 70,24 40,40 24,70" fill="#e62229" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="40,40 70,24 55,55 24,70" fill="#990012" />
    <line x1="14" y1="45" x2="14" y2="60" stroke="#000000" stroke-width="10" stroke-linecap="round" />
    <circle cx="14" cy="30" r="5" fill="#000000" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ -->
  <g transform="translate(20, 492) scale(1, -1)">
    <polygon points="14,14 70,24 40,40 24,70" fill="#e62229" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="40,40 70,24 55,55 24,70" fill="#990012" />
    <line x1="14" y1="45" x2="14" y2="60" stroke="#000000" stroke-width="10" stroke-linecap="round" />
    <circle cx="14" cy="30" r="5" fill="#000000" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(492, 492) scale(-1, -1)">
    <polygon points="14,14 70,24 40,40 24,70" fill="#e62229" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="40,40 70,24 55,55 24,70" fill="#990012" />
    <line x1="14" y1="45" x2="14" y2="60" stroke="#000000" stroke-width="10" stroke-linecap="round" />
    <circle cx="14" cy="30" r="5" fill="#000000" />
  </g>

  <!-- Декоративные штрихи скорости по центру сторон -->
  <line x1="240" y1="42" x2="272" y2="42" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  <line x1="240" y1="470" x2="272" y2="470" stroke="#000000" stroke-width="6" stroke-linecap="round" />
</svg>
