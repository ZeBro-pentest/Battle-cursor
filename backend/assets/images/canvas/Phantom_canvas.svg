<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Основной контур рамки с чередованием цветов (Алый и Темно-красный с image_3b8dc6.png) -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="miter" />
  <rect x="42" y="42" width="428" height="428" fill="none" stroke="#b11b1b" stroke-width="4" />
  <rect x="46" y="46" width="420" height="420" fill="none" stroke="#d60e0e" stroke-width="4" />

  <!-- Тонкие тактические насечки по периметру -->
  <rect x="58" y="58" width="396" height="396" fill="none" stroke="#ff9900" stroke-width="1" stroke-dasharray="10 30" opacity="0.5" />

  <!-- УГЛОВЫЕ МОДУЛИ: Снайперские прицелы-мишени -->

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Желтый визир с перекрестием -->
  <g transform="translate(42, 42)">
    <!-- Угловая стрелка-подложка -->
    <polygon points="0,0 45,0 30,15 15,30 0,45" fill="#d60e0e" stroke="#000000" stroke-width="4" />
    <polygon points="30,15 45,0 30,30 15,30" fill="#b11b1b" />
    
    <!-- Центральный оранжево-желтый круг -->
    <circle cx="20" cy="20" r="14" fill="#ffb400" stroke="#000000" stroke-width="4" />
    
    <!-- Перекрестие (Диагональная линия тактического прицела) -->
    <line x1="-5" y1="-5" x2="45" y2="45" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="5" y1="35" x2="35" y2="5" stroke="#000000" stroke-width="3" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(470, 42) scale(-1, 1)">
    <polygon points="0,0 45,0 30,15 15,30 0,45" fill="#d60e0e" stroke="#000000" stroke-width="4" />
    <polygon points="30,15 45,0 30,30 15,30" fill="#b11b1b" />
    <circle cx="20" cy="20" r="14" fill="#ffb400" stroke="#000000" stroke-width="4" />
    <line x1="-5" y1="-5" x2="45" y2="45" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="5" y1="35" x2="35" y2="5" stroke="#000000" stroke-width="3" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ -->
  <g transform="translate(42, 470) scale(1, -1)">
    <polygon points="0,0 45,0 30,15 15,30 0,45" fill="#d60e0e" stroke="#000000" stroke-width="4" />
    <polygon points="30,15 45,0 30,30 15,30" fill="#b11b1b" />
    <circle cx="20" cy="20" r="14" fill="#ffb400" stroke="#000000" stroke-width="4" />
    <line x1="-5" y1="-5" x2="45" y2="45" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="5" y1="35" x2="35" y2="5" stroke="#000000" stroke-width="3" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(470, 470) scale(-1, -1)">
    <polygon points="0,0 45,0 30,15 15,30 0,45" fill="#d60e0e" stroke="#000000" stroke-width="4" />
    <polygon points="30,15 45,0 30,30 15,30" fill="#b11b1b" />
    <circle cx="20" cy="20" r="14" fill="#ffb400" stroke="#000000" stroke-width="4" />
    <line x1="-5" y1="-5" x2="45" y2="45" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="5" y1="35" x2="35" y2="5" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Центральные маркеры балансировки кадра (открытые визирные скобы) -->
  <path d="M 236,26 L 256,16 L 276,26" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="miter" />
  <path d="M 236,486 L 256,496 L 276,486" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="miter" />
</svg>
