<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Внутренний и внешний контуры рамки (Изящный черный каркас) -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Основная линия рамки: Глубокий черничный тон -->
  <rect x="44" y="44" width="424" height="424" fill="none" stroke="#29126e" stroke-width="6" />

  <!-- Внутренний неоновый фиолетовый кант -->
  <rect x="52" y="52" width="408" height="408" fill="none" stroke="#5d2cb3" stroke-width="3" />

  <!-- ДЕКОРАТИВНЫЕ СТЫКИ: Элементы круглого кольца по центру сторон -->
  <g transform="translate(256, 44)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="4" fill="#5d2cb3" />
  </g>
  <g transform="translate(256, 468)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="4" fill="#5d2cb3" />
  </g>
  <g transform="translate(44, 256)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="4" fill="#5d2cb3" />
  </g>
  <g transform="translate(468, 256)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="4" fill="#5d2cb3" />
  </g>


  <!-- УГЛОВЫЕ МОДУЛИ: Магические граненые Розы Ветров в кольцах -->

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ -->
  <g transform="translate(54, 54)">
    <!-- Фирменное защитное кольцо (как на оригинальной иконке) -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="4" />
    
    <!-- Главный луч под 45 градусов, бьющий внутрь холста -->
    <g transform="rotate(45)">
      <!-- Светлая аметистовая грань -->
      <polygon points="0,0 0,-52 12,-12" fill="#5d2cb3" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
      <!-- Темная черничная грань -->
      <polygon points="0,0 0,-52 -12,-12" fill="#29126e" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
    </g>

    <!-- Основные осевые лучи (Вверх и Вправо) -->
    <g transform="rotate(0)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(90)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>

    <!-- Малые промежуточные лучи -->
    <g transform="rotate(22.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
    <g transform="rotate(67.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(458, 54)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="4" />
    <g transform="rotate(-45)">
      <polygon points="0,0 0,-52 12,-12" fill="#5d2cb3" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
      <polygon points="0,0 0,-52 -12,-12" fill="#29126e" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
    </g>
    <g transform="rotate(0)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(-90)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(-22.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
    <g transform="rotate(-67.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ -->
  <g transform="translate(54, 458)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="4" />
    <g transform="rotate(135)">
      <polygon points="0,0 0,-52 12,-12" fill="#5d2cb3" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
      <polygon points="0,0 0,-52 -12,-12" fill="#29126e" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
    </g>
    <g transform="rotate(180)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(90)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(112.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
    <g transform="rotate(157.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ -->
  <g transform="translate(458, 458)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="4" />
    <g transform="rotate(-135)">
      <polygon points="0,0 0,-52 12,-12" fill="#5d2cb3" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
      <polygon points="0,0 0,-52 -12,-12" fill="#29126e" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
    </g>
    <g transform="rotate(180)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(-90)">
      <polygon points="0,0 0,-36 9,-9" fill="#5d2cb3" stroke="#000000" stroke-width="2.5" />
      <polygon points="0,0 0,-36 -9,-9" fill="#29126e" stroke="#000000" stroke-width="2.5" />
    </g>
    <g transform="rotate(-112.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
    <g transform="rotate(-157.5)">
      <polygon points="0,0 0,-24 6,-6" fill="#5d2cb3" stroke="#000000" stroke-width="2" />
      <polygon points="0,0 0,-24 -6,-6" fill="#29126e" stroke="#000000" stroke-width="2" />
    </g>
  </g>
</svg>
