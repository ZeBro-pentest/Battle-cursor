<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Внешний контур с легким изломом граней к центру сторон -->
  <path d="M 24 24 L 256 14 L 488 24 L 498 256 L 488 488 L 256 498 L 24 488 L 14 256 Z" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

  <!-- Внутренний тонкий контур, дублирующий излом граней -->
  <path d="M 36 36 L 256 26 L 476 36 L 486 256 L 476 476 L 256 486 L 36 476 L 26 256 Z" fill="none" stroke="#000000" stroke-width="2" opacity="0.5" />

  <!-- Линии внутренней огранки по углам, как на лучах звезды -->
  <line x1="24" y1="24" x2="60" y2="60" stroke="#000000" stroke-width="4" />
  <line x1="488" y1="24" x2="452" y2="60" stroke="#000000" stroke-width="4" />
  <line x1="24" y1="488" x2="60" y2="452" stroke="#000000" stroke-width="4" />
  <line x1="488" y1="488" x2="452" y2="452" stroke="#000000" stroke-width="4" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Острый звездный элемент с огранкой -->
  <g transform="translate(40, 40)">
    <path d="M 0 -25 L 6 0 L 25 6 L 0 0 L -6 25 L -2 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="6" x2="25" y2="6" stroke="#000000" stroke-width="2" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Острый звездный элемент с огранкой -->
  <g transform="translate(472, 40)">
    <path d="M 0 -25 L 6 0 L 25 6 L 0 0 L -6 25 L -2 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="6" x2="25" y2="6" stroke="#000000" stroke-width="2" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Острый звездный элемент с огранкой -->
  <g transform="translate(40, 472)">
    <path d="M 0 -25 L 6 0 L 25 6 L 0 0 L -6 25 L -2 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="6" x2="25" y2="6" stroke="#000000" stroke-width="2" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Острый звездный элемент с огранкой -->
  <g transform="translate(472, 472)">
    <path d="M 0 -25 L 6 0 L 25 6 L 0 0 L -6 25 L -2 -2 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="6" x2="25" y2="6" stroke="#000000" stroke-width="2" />
  </g>
</svg>
