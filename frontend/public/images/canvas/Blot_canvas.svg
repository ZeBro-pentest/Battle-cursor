<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Внешний жирный черный контур -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#000000" stroke-width="8" rx="6" />

  <!-- Внутренний тонкий контур, создающий эффект двойной линии курсора -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#000000" stroke-width="3" rx="3" opacity="0.8" />

  <!-- Декоративные системные перекрестия по бокам (как в графических редакторах) -->
  <line x1="256" y1="12" x2="256" y2="28" stroke="#000000" stroke-width="4" />
  <line x1="256" y1="484" x2="256" y2="500" stroke="#000000" stroke-width="4" />
  <line x1="12" y1="256" x2="28" y2="256" stroke="#000000" stroke-width="4" />
  <line x1="484" y1="256" x2="500" y2="256" stroke="#000000" stroke-width="4" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Мини-курсор, смотрящий в центр -->
  <g transform="translate(45, 45) rotate(-45)">
    <path d="M 0 0 L 0 24 L 7 17 L 15 25 L 18 22 L 10 14 L 17 14 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Мини-курсор, смотрящий в центр -->
  <g transform="translate(467, 45) rotate(45)">
    <path d="M 0 0 L 0 24 L 7 17 L 15 25 L 18 22 L 10 14 L 17 14 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Mini-курсор, смотрящий в центр -->
  <g transform="translate(45, 467) rotate(-135)">
    <path d="M 0 0 L 0 24 L 7 17 L 15 25 L 18 22 L 10 14 L 17 14 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Мини-курсор, смотрящий в центр -->
  <g transform="translate(467, 467) rotate(135)">
    <path d="M 0 0 L 0 24 L 7 17 L 15 25 L 18 22 L 10 14 L 17 14 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>
</svg>
