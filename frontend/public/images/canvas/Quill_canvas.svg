<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Основной черный контур (плавный, скругленный, как линии пера) -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" rx="14" />

  <!-- Внутренняя изящная рамка-отступ -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#000000" stroke-width="2" rx="10" opacity="0.4" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Наконечник пера с прорезью и отверстием -->
  <g transform="translate(42, 42) rotate(-45)">
    <!-- Форма пера -->
    <path d="M 0 -22 L 14 -4 L 10 14 L -10 14 L -14 -4 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Круглое отверстие по центру -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <!-- Капиллярная прорезь -->
    <line x1="0" y1="-22" x2="0" y2="-3" stroke="#000000" stroke-width="2.5" />
    <line x1="0" y1="3" x2="0" y2="14" stroke="#000000" stroke-width="2" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Второе перо для симметрии -->
  <g transform="translate(470, 470) rotate(135)">
    <path d="M 0 -22 L 14 -4 L 10 14 L -10 14 L -14 -4 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="-22" x2="0" y2="-3" stroke="#000000" stroke-width="2.5" />
    <line x1="0" y1="3" x2="0" y2="14" stroke="#000000" stroke-width="2" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Аккуратная каплевидная клякса чернил -->
  <g transform="translate(468, 44)">
    <path d="M 0 -12 C 8 -12 12 -4 12 4 C 12 10 6 14 0 14 C -6 14 -12 10 -12 4 C -12 -4 -8 -12 0 -12 Z" fill="#000000" />
    <circle cx="10" cy="14" r="2" fill="#000000" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Каплевидная клякса чернил -->
  <g transform="translate(44, 468)">
    <path d="M 0 -12 C 8 -12 12 -4 12 4 C 12 10 6 14 0 14 C -6 14 -12 10 -12 4 C -12 -4 -8 -12 0 -12 Z" fill="#000000" />
    <circle cx="-10" cy="-14" r="2" fill="#000000" />
  </g>

  <!-- Тонкие каллиграфические «усики»-росчерки по бокам -->
  <path d="M 236 24 Q 256 16 276 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  <path d="M 236 488 Q 256 496 276 488" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
</svg>
