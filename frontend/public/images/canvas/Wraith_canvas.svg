<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Основная соединительная рамка — тонкая, полупрозрачная, чтобы не перегружать безконтурный стиль -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#00d5f0" stroke-width="3" opacity="0.4" />
  <rect x="35" y="35" width="442" height="442" fill="none" stroke="#5856d6" stroke-width="1" opacity="0.2" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Полигональный кристалл (цвета прямо с image_3befdc.png) -->
  <g transform="translate(32, 32)">
    <!-- Левая/верхняя яркая грань (Яркий бирюзовый неон) -->
    <polygon points="0,0 -16,-16 -16,40 0,20" fill="#00f0ff" />
    <polygon points="0,0 -16,-16 40,-16 20,0" fill="#00d5f0" />
    
    <!-- Внутренние темные грани (Синий и Фиолетовый «сердечник») -->
    <polygon points="0,0 0,20 15,15" fill="#0070ff" />
    <polygon points="0,0 20,0 15,15" fill="#5856d6" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Поворот полигонов для сохранения направления света -->
  <g transform="translate(480, 32)">
    <!-- Правая более темная грань -->
    <polygon points="0,0 16,-16 16,40 0,20" fill="#00a3b8" />
    <polygon points="0,0 16,-16 -40,-16 -20,0" fill="#00d5f0" />
    
    <!-- Сердцевина -->
    <polygon points="0,0 0,20 -15,15" fill="#0070ff" />
    <polygon points="0,0 -20,0 -15,15" fill="#5856d6" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Кристаллический узел -->
  <g transform="translate(32, 480)">
    <polygon points="0,0 -16,16 -16,-40 0,-20" fill="#00f0ff" />
    <polygon points="0,0 -16,16 40,16 20,0" fill="#00a3b8" />
    
    <polygon points="0,0 0,-20 15,-15" fill="#0070ff" />
    <polygon points="0,0 20,0 15,-15" fill="#5856d6" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Кристаллический узел -->
  <g transform="translate(480, 480)">
    <polygon points="0,0 16,16 16,-40 0,-20" fill="#00a3b8" />
    <polygon points="0,0 16,16 -40,16 -20,0" fill="#00a3b8" />
    
    <polygon points="0,0 0,-20 -15,-15" fill="#0070ff" />
    <polygon points="0,0 -20,0 -15,-15" fill="#5856d6" />
  </g>

  <!-- Дополнительные декоративные «острые» стрелки-индикаторы по центру сторон -->
  <!-- Верхняя сторона -->
  <polygon points="256,20 246,32 266,32" fill="#00f0ff" />
  <!-- Левая сторона -->
  <polygon points="20,256 32,246 32,266" fill="#00f0ff" />
  <!-- Правая сторона -->
  <polygon points="492,256 480,246 480,266" fill="#00a3b8" />
  <!-- Нижняя сторона -->
  <polygon points="256,492 246,480 266,480" fill="#5856d6" />
</svg>
