<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Внешний тонкий черный контур (основа) -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#000000" stroke-width="6" rx="8" />

  <!-- Внутренняя неоновая полоса (Цвет как у прицела курсора) -->
  <rect x="34" y="34" width="444" height="444" fill="none" stroke="#005a4e" stroke-width="4" stroke-dasharray="20 10" rx="4" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Острая стрелка (дублирует наконечник курсора) -->
  <path d="M 16 50 L 16 16 L 50 16 L 30 30 Z" fill="#b17066" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
  
  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Вторая стрелка для симметрии движения -->
  <path d="M 496 462 L 496 496 L 462 496 L 482 482 Z" fill="#b17066" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Элемент круглого прицела -->
  <path d="M 466 24 A 20 20 0 0 1 488 46" fill="none" stroke="#000000" stroke-width="6" />
  <circle cx="488" cy="24" r="6" fill="#005a4e" stroke="#000000" stroke-width="4" />

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Элемент круглого прицела -->
  <path d="M 46 488 A 20 20 0 0 1 24 466" fill="none" stroke="#000000" stroke-width="6" />
  <circle cx="24" cy="488" r="6" fill="#005a4e" stroke="#000000" stroke-width="4" />
</svg>
