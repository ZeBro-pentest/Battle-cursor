<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Жирная основная рамка (поддерживает плотную массу курсора) -->
  <rect x="28" y="28" width="456" height="456" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" rx="24" />

  <!-- Тонкий внутренний контур для изящного контраста -->
  <rect x="46" y="46" width="420" height="420" fill="none" stroke="#000000" stroke-width="2" rx="16" opacity="0.25" />

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Три массивных капсульных луча клика (как на image_3bfe7c.png) -->
  <g transform="translate(28, 28)">
    <line x1="-8" y1="-20" x2="-18" y2="-46" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-20" y1="-8" x2="-46" y2="-18" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-16" y1="-16" x2="-38" y2="-38" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- ВЕРХНИЙ ПРАВЫЙ УГОЛ: Три массивных луча клика -->
  <g transform="translate(484, 28)">
    <line x1="8" y1="-20" x2="14" y2="-46" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="20" y1="-8" x2="46" y2="-18" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="16" y1="-16" x2="38" y2="-38" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- НИЖНИЙ ЛЕВЫЙ УГОЛ: Три массивных луча клика -->
  <g transform="translate(28, 484)">
    <line x1="-8" y1="20" x2="-14" y2="46" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-20" y1="8" x2="-46" y2="18" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-16" y1="16" x2="-38" y2="38" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- НИЖНИЙ ПРАВЫЙ УГОЛ: Три массивных луча клика -->
  <g transform="translate(484, 484)">
    <line x1="8" y1="20" x2="14" y2="46" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="20" y1="8" x2="46" y2="18" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="16" y1="16" x2="38" y2="38" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
