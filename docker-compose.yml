services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,.ngrok-free.app,.ngrok-free.dev
    volumes:
      - ./backend:/app
      - ./backend/db.sqlite3:/app/db.sqlite3
    depends_on:
      - redis
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  celery:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_URL=redis://redis:6379/1
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    command: celery -A config worker -l info

  celery-beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_URL=redis://redis:6379/1
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
